name: Build BSN APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build User and Admin APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify BSN ZIP
        run: |
          test -f BSN_Priority2_Fixed_V3.zip

      - name: Extract BSN Project
        run: |
          mkdir -p bsn-project
          unzip -q BSN_Priority2_Fixed_V3.zip -d bsn-project

          test -f bsn-project/settings.gradle.kts
          test -f bsn-project/gradle/libs.versions.toml
          test -f bsn-project/app/build.gradle.kts
          test -f bsn-project/admin/build.gradle.kts

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK Packages
        run: |
          sdkmanager --install \
            "platforms;android-36.1" \
            "build-tools;36.0.0"

          yes | sdkmanager --licenses

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create Admin Debug Keystore
        working-directory: bsn-project
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

      - name: Build Both APKs
        working-directory: bsn-project
        run: |
          gradle --no-daemon --stacktrace \
            :app:assembleDebug \
            :admin:assembleDebug

      - name: Upload Both APKs
        uses: actions/upload-artifact@v4
        with:
          name: BSN-User-and-Admin-APK
          path: |
            bsn-project/app/build/outputs/apk/debug/*.apk
            bsn-project/admin/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
