name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Unzip and Prepare
        run: |
          unzip -o BSN_Priority2_Fixed_V3.zip -d web-app
          find web-app -name "index.html" | head -n 20
      - name: Build with Capacitor
        run: |
          cd web-app
          INDEX=$(find . -name "index.html" | head -n 1)
          echo "Found index at: $INDEX"
          DIR=$(dirname "$INDEX")
          echo "Using folder: $DIR"
          mkdir -p www
          find "$DIR" -maxdepth 1 -mindepth 1 ! -name www -exec cp -a {} www/ \;
          echo '<h1>BSN App</h1>' > www/index.html
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "BSN App" com.bsn.app --web-dir=www
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BSN-APK
          path: web-app/android/app/build/outputs/apk/debug/app-debug.apk
