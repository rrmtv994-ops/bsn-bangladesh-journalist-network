name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip V3
        run: unzip -o BSN_Priority2_Fixed_V3.zip -d app-src
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build with Capacitor
        run: |
          npm install -g @capacitor/cli
          mkdir web-app && cp -r app-src/* web-app/ || cp -r app-src/*/* web-app/
          cd web-app
          npm init -y
          npm install @capacitor/core @capacitor/cli
          npx cap init BSN com.bsn.app --web-dir=.
          npx cap add android
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BSN-APK
          path: web-app/android/app/build/outputs/apk/debug/*.apk
