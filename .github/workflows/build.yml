name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Unzip and Prepare
        run: |
          unzip -o BSN_Priority2_Fixed_V3.zip -d web-app
          ls -R web-app | head -n 100
      - name: Build with Capacitor
        run: |
          cd web-app
          mkdir -p www
          for f in *; do if [ "$f" != "www" ]; then cp -a "$f" www/; fi; done
          ls www | head -n 20
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "BSN App" com.bsn.app --web-dir=www
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BSN-APK
          path: web-app/android/app/build/outputs/apk/debug/app-debug.apk
