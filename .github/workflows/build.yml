name: Build BSN APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check ZIP File
        run: |
          if [ ! -f "BSN_Priority2_Fixed_V3.zip" ]; then
            echo "ERROR: BSN ZIP file not found!"
            exit 1
          fi

      - name: Extract BSN Project
        run: |
          unzip -q BSN_Priority2_Fixed_V3.zip -d bsn-project
          ls -la bsn-project

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Packages
        run: |
          sdkmanager "platform-tools" \
                     "platforms;android-36.1" \
                     "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Both APKs
        run: |
          cd bsn-project
          gradle --no-daemon --stacktrace \
            :app:assembleDebug \
            :admin:assembleDebug

      - name: Upload BSN APK Files
        uses: actions/upload-artifact@v4
        with:
          name: BSN-APK-Files
          path: |
            bsn-project/app/build/outputs/apk/debug/*.apk
            bsn-project/admin/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
